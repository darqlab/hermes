name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: make release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hermes-linux-amd64
            dist/hermes-linux-arm64
            dist/hermes-darwin-amd64
            dist/hermes-darwin-arm64
            dist/hermes-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
